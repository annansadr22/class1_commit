
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #15251c;
      color: white;
      text-align: center;
      margin: 0;
      padding: 30px 12px;
    }

    canvas {
      background: #203b2a;
      border: 3px solid #4caf50;
      max-width: 95%;
    }

    button {
      padding: 12px 24px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #388e3c;
    }
  </style>
</head>

<body>
  <h1>Snake Game</h1>
  <h2>Score: <span id="score">0</span></h2>

  <canvas id="game" width="400" height="400"></canvas>

  <p id="message">Press Start to play</p>
  <button onclick="startGame()">Start / Restart</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const box = 20;
    const size = 20;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let game;

    function createFood() {
      let position;

      do {
        position = {
          x: Math.floor(Math.random() * size),
          y: Math.floor(Math.random() * size)
        };
      } while (snake.some(part =>
        part.x === position.x && part.y === position.y
      ));

      return position;
    }

    function startGame() {
      clearInterval(game);

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 }
      ];

      direction = "RIGHT";
      nextDirection = "RIGHT";
      score = 0;

      food = createFood();

      document.getElementById("score").textContent = score;
      document.getElementById("message").textContent =
        "Use arrow keys to move";

      drawGame();
      game = setInterval(drawGame, 150);
    }

    document.addEventListener("keydown", function(event) {
      const keys = ["ArrowUp", "ArrowDown",
                    "ArrowLeft", "ArrowRight"];

      if (keys.includes(event.key)) {
        event.preventDefault();
      }

      if (event.key === "ArrowUp" &&
          direction !== "DOWN") {
        nextDirection = "UP";
      }

      if (event.key === "ArrowDown" &&
          direction !== "UP") {
        nextDirection = "DOWN";
      }

      if (event.key === "ArrowLeft" &&
          direction !== "RIGHT") {
        nextDirection = "LEFT";
      }

      if (event.key === "ArrowRight" &&
          direction !== "LEFT") {
        nextDirection = "RIGHT";
      }
    });

    function drawGame() {
      ctx.clearRect(0, 0, 400, 400);

      direction = nextDirection;

      let head = { ...snake[0] };

      if (direction === "UP") head.y--;
      if (direction === "DOWN") head.y++;
      if (direction === "LEFT") head.x--;
      if (direction === "RIGHT") head.x++;

      const eating =
        head.x === food.x && head.y === food.y;

      // The tail moves away unless food is eaten.
      const body = eating ? snake : snake.slice(0, -1);

      if (
        head.x < 0 || head.x >= size ||
        head.y < 0 || head.y >= size ||
        body.some(part =>
          part.x === head.x && part.y === head.y
        )
      ) {
        clearInterval(game);
        document.getElementById("message").textContent =
          "Game Over! Final Score: " + score;
        return;
      }

      snake.unshift(head);

      if (eating) {
        score++;
        document.getElementById("score").textContent = score;

        if (snake.length === size * size) {
          clearInterval(game);
          document.getElementById("message").textContent =
            "You Win!";
          return;
        }

        food = createFood();
      } else {
        snake.pop();
      }

      // Draw food
      ctx.fillStyle = "red";
      ctx.fillRect(
        food.x * box,
        food.y * box,
        box,
        box
      );

      // Draw snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "lime" : "#4caf50";

        ctx.fillRect(
          part.x * box,
          part.y * box,
          box - 2,
          box - 2
        );
      });
    }

    startGame();
  </script>
</body>
</html>
